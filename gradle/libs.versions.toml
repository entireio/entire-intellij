[versions]
# The oldest supported IDE is 2025.3, which bundles Kotlin 2.2.20 and coroutines 1.10.1.
# The modules compile against those versions, and the IDE supplies them when the plugin runs.
kotlin-stdlib = "2.2.20"
coroutines = "1.10.1"
# The IDE supplies kotlinx-serialization on its class path as well. The modules compile against
# 1.9.0, which is built with Kotlin 2.2, and use only the JsonElement API that every later version keeps.
serialization = "1.9.0"
junit = "5.13.4"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin-stdlib" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
